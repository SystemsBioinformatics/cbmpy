[tox]
envlist = py{38,39,310,311,312}
skipsdist = false
indexurl = https://pypi.org/simple

[testenv]
deps =
    -rrequirements.txt
commands =
    pytest -v --tb=short

[testenv:lint]
deps =
    flake8
commands =
    flake8 cbmpy

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[pytest]
addopts = -v --tb=short
