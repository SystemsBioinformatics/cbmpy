[tox]
envlist = py{38,39,310,311,312}
minversion = 4.0
skip_missing_interpreters = true

[testenv]
description = Run the test suite
deps =
    pytest >= 7.0
    pytest-cov
    numpy >= 1.17.0
    scipy
    python-libsbml >= 5.18.0
    swiglpk
    XlsxWriter
    packaging
    pyparsing
    lxml
    xlrd
    xlwt
install_command = pip install {opts} {packages}
commands =
    pytest {posargs:-v --tb=short --cov=cbmpy --cov-report=xml}
    pytest -v --tb=short -m "integration" --cov=cbmpy --cov-append {posargs:}

[testenv:lint]
description = Run pylint and docformatter checks
deps =
    pylint >= 2.17
    docformatter >= 1.7.7
    black >= 23.0
commands =
    pylint cbmpy
    docformatter --diff --recursive cbmpy/
    black --check --line-length 79 cbmpy/

[testenv:format]
description = Format all code and docstrings
deps =
    docformatter >= 1.7.7
    black >= 23.0
commands =
    docformatter --in-place --recursive --style=numpy --black cbmpy/
    black --line-length 79 cbmpy/

[testenv:build]
description = Build source distribution and wheel
deps =
    build >= 1.0
    wheel
    setuptools >= 61.0
skip_install = true
commands =
    python -m build --sdist --wheel --outdir {distdir} .

[testenv:check]
description = Check package metadata and build output
deps =
    twine >= 4.0
    build >= 1.0
skip_install = true
commands =
    python -m build --sdist --wheel --outdir {distdir} .
    twine check {distdir}/*

[testenv:sdist]
description = Build only source distribution
deps =
    build >= 1.0
    wheel
skip_install = true
commands =
    python -m build --sdist --outdir {distdir} .

[testenv:wheel]
description = Build only wheel
deps =
    build >= 1.0
    wheel
skip_install = true
commands =
    python -m build --wheel --outdir {distdir} .

[testenv:docs]
description = Build Sphinx documentation
deps =
    sphinx >= 7.0
    sphinx-rtd-theme
    myst-parser
commands =
    sphinx-build -b html -W --keep-going docs docs/_build/html

[testenv:mypy]
description = Type check with mypy
deps =
    mypy >= 1.0
    types-PyYAML
commands =
    mypy cbmpy --ignore-missing-imports --no-strict-optional

[testenv:coverage]
description = Run tests and generate coverage report
deps =
    pytest >= 7.0
    pytest-cov
    numpy >= 1.17.0
    scipy
    python-libsbml >= 5.18.0
    swiglpk
    XlsxWriter
commands =
    pytest -v --tb=short --cov=cbmpy --cov-report=term-missing --cov-report=html {posargs:}

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[pytest]
addopts = -v --tb=short
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
